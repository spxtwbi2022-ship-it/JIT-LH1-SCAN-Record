// 【修正區域 1: 確保日誌輸出安全】
function appendLog(text){
    // 限制日誌訊息長度，避免顯示完整的 HTML 錯誤頁面
    let safeText = String(text);
    
    // 檢查訊息是否像是 HTML 內容 (例如包含 <html 或 <body 等) 或訊息過長，進行截斷
    if (safeText.includes('<html') || safeText.includes('<body') || safeText.length > 500) {
        safeText = safeText.substring(0, 500) + '... (載入錯誤訊息過長或包含 HTML 已截斷)';
    }

    logEl.textContent = new Date().toLocaleTimeString() + ' - ' + safeText + '\n' + logEl.textContent;
}

function initAudioContext() {
    if (audioContext) return;
    try {
        // 嘗試建立 AudioContext
        // 由於瀏覽器可能需要前綴，這裡使用 window.AudioContext 或 window.webkitAudioContext
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
        console.log("AudioContext 初始化成功");
    } catch (e) {
        console.warn("無法初始化 AudioContext:", e);
    }
}

// 使用 Web Audio API 生成一個短促的 Beep 聲音
function playBeep() {
    if (!audioContext) {
        // 如果 AudioContext 尚未初始化 (可能因為首次播放被阻止)，則嘗試初始化
        initAudioContext();
        if (!audioContext) return;
    }
    
    // Web Audio API 的聲音生成邏輯
    const duration = 0.1; // 聲音持續時間 (秒)
    const frequency = 880; // 聲音頻率 (Hz, A5 音高)
    const volume = 0.5;
    
    // 建立震盪器 (Oscillator)
    const oscillator = audioContext.createOscillator();
    // 建立增益節點 (GainNode) 來控制音量
    const gainNode = audioContext.createGain();

    oscillator.type = 'square'; // 方波聲音較為尖銳，適合嗶嗶聲
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

    gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
    
    // 連接節點: 震盪器 -> 增益 -> 輸出
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    // 開始和結束聲音
    oscillator.start();
    // 聲音在 duration 時間後結束
    oscillator.stop(audioContext.currentTime + duration);

    // (可選) 在聲音結束後，將音量快速降為 0，避免爆音
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
}

function enqueue(code){
    // 【新增】播放音效

    // ⬇️ 【新增：檢查所有歷史紀錄】
    // 使用 Array.prototype.some() 檢查 buffer 中是否已存在相同編號 (code) 的紀錄
    const isDuplicate = buffer.some(item => item.code === code); 
    
    if(isDuplicate){
        // 如果發現重複，則記錄日誌並退出，不將其加入 buffer
        appendLog(`⚠️ 忽略重複掃描: ${code} (已在歷史紀錄中)`); 
        return; 
    }
    // ⬆️ 【結束：檢查所有歷史紀錄】
    
    const now = new Date(); // 創建 Date 物件

    // ⬇️ 【關鍵修改】將時間戳直接轉換成本地時區字串
    const localTimeString = now.toLocaleString('zh-TW', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false, // 24 小時制
        timeZone: 'Asia/Taipei' // 確保是台灣時間
    });
    
    const item = {
        code: code,
        // driver: driverInput.value || 'unknown',
        // ⬇️ 這裡修改為傳送專車編號
        driver: whTruckNumberSelect.value || 'unknown',
        seller: sellerSelect.value || '',

        ts: localTimeString
        // ts: new Date().toISOString()
    };
    // simple session dedupe // 由於我們已經檢查了所有歷史紀錄，不需要原來的 "simple session dedupe" 檢查。
    // const last = buffer[buffer.length-1];
    // if(last && last.code === item.code)
    //     { appendLog('忽略重複掃描: '+item.code); 
    //      return; 
    // }
    
    buffer.push(item);
    saveLocalBuffer();
    // appendLog('加入 buffer: '+code+' (buffer='+buffer.length+')'); // 舊日誌可註解掉
    appendLog(`🟢 掃到: ${code}`); // 新日誌顯示
    
    // 【修改點】呼叫更新列表
    updateScanList();
    if(buffer.length >= BATCH_SIZE) sendBatch();
}

function handleScannerInput(event) {
    // 1. 只有在刷槍模式啟動時才執行
    if (!isScannerMode) return;

    // 2. 【核心修正】只接受可打印字符和 Enter 鍵
    // 使用正則表達式檢查是否為有效字符 (數字、字母、常見符號)
    const isValidChar = /^[a-zA-Z0-9\-_\.]$/.test(event.key);
    const isEnter = event.key === 'Enter';
    
    // 如果既不是有效字符也不是 Enter,直接忽略
    if (!isValidChar && !isEnter) {
        // 【可選】除錯用:記錄被過濾的按鍵
        if (event.key.length > 1) {
            appendLog(`⚠️ [已過濾] 功能鍵: ${event.key}`);
        }
        return;
    }

    // 3. 重置計時器
    if (scannerTimer) clearTimeout(scannerTimer);

    // 4. 檢查是否為條碼結束符號 (Enter)
    if (isEnter) {
        event.preventDefault(); // 阻止換行或表單提交
        
        const code = scannerBuffer.trim();
        scannerBuffer = ''; // 清空緩衝區
        
        if (code) {
            statusEl.textContent = '掃到: ' + code;
            enqueue(code);
            appendLog(`✅ [刷槍成功] ${code}`); 
        } else {
            appendLog('⚠️ [刷槍] Enter 但緩衝區空白');
        }
    } 
    // 5. 累積有效字符
    else if (isValidChar) {
        scannerBuffer += event.key;
        
        // 6. 設定超時計時器 (備用機制)
        scannerTimer = setTimeout(() => {
            const code = scannerBuffer.trim();
            scannerBuffer = '';
            
            if (code) {
                statusEl.textContent = '掃到 (超時): ' + code;
                enqueue(code);
                appendLog(`🟠 [刷槍超時] 無 Enter,強制結算: ${code}`);
            }
        }, SCANNER_TIMEOUT_MS);
    }
}

// 【最終版本：修復連發、未定義變數和傳送錯誤】
async function sendBatch(){
    if(sending) return;
    
    // ⬇️ 【步驟 1：建立包含索引的待上傳清單】
    const indexedPending = buffer
        .map((item, index) => ({ item, index }))
        .filter(entry => !entry.item.sent);

    // 檢查是否有待上傳資料
    if(indexedPending.length === 0) {
        appendLog('✅ 沒有待上傳資料。');
        return; 
    }
    
    if(!navigator.onLine){ appendLog('離線，暫不送出'); return; }
    
    sending = true;
    
    // 從帶有索引的待上傳清單中取 batch 批次
    const batchEntries = indexedPending.slice(0, BATCH_SIZE); 
    
    // 準備傳送到後端的數據 (只包含 item)
    const batchToSend = batchEntries.map(entry => entry.item);

    try{
        const resp = await fetch(GAS_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain'},
        // 傳送正確的 batchToSend
        body: JSON.stringify({ records: batchToSend, api_key: API_KEY || '' })
    });
    
    // 【檢查 HTTP 狀態碼】
    if (!resp.ok) {
        const errorText = await resp.text();
        throw new Error(`HTTP 錯誤: ${resp.status} - ${errorText.substring(0, 50)}`);
    }

    const j = await resp.json();
    if(j.status === 'ok'){
        
        // 【使用索引直接在原 buffer 上標記 sent=true】
        batchEntries.forEach(entry => {
            buffer[entry.index].sent = true;
        });
        
        saveLocalBuffer();
    
        const remainingToUpload = buffer.filter(item => !item.sent).length; 
        // 修正日誌，使用 batchToSend.length 顯示成功上傳筆數
        appendLog(`✅ 上傳成功 ${batchToSend.length} 筆, 剩餘待上傳: ${remainingToUpload} 筆 (總紀錄數: ${buffer.length})`);
        
        updateScanList();

        // 【連發機制】
        if (remainingToUpload > 0) {
            setTimeout(sendBatch, 0); 
        }
        
        } else {
        appendLog('後端回傳錯誤: '+JSON.stringify(j));
    }
    }catch(err){
        appendLog(`🔴 上傳失敗，稍後重試。錯誤類型: ${err.name} - ${err.message}`); 
        console.error(err); 
    } finally {
        // 確保無論成功或失敗，上傳狀態旗標都被重置
        sending = false;
    }
}

function startBatchTimer(){
stopBatchTimer();
timerId = setInterval(()=>{ sendBatch(); }, BATCH_TIMEOUT_MS);
}
function stopBatchTimer(){ if(timerId) clearInterval(timerId); timerId=null; }

// 【新增函式】 從 GAS 獲取專車清單
async function loadTrucks() {
    appendLog('嘗試載入專車清單...');
    try {
        const truckEndpoint = GAS_ENDPOINT + '?action=getTrucks';
        const resp = await fetch(truckEndpoint);
        if (!resp.ok) {
            throw new Error(`HTTP 錯誤: ${resp.status}`);
        }
        const j = await resp.json();
        
        whTruckNumberSelect.innerHTML = '<option value="">-- 請選擇專車 --</option>';

        if (j.status === 'ok' && j.trucks && j.trucks.length > 0) {
            j.trucks.forEach(truck => {
                const option = document.createElement('option');
                option.value = truck;
                option.textContent = truck;
                whTruckNumberSelect.appendChild(option);
            });
            appendLog(`成功載入 ${j.trucks.length} 個專車編號`);
        } else {
            appendLog('專車清單載入失敗或為空: ' + (j.message || '請確認 GAS 設置'));
        }
    } catch (err) {
        appendLog('載入專車清單時發生網路錯誤');
        console.error(err);
        whTruckNumberSelect.innerHTML = '<option value="">-- 載入錯誤 --</option>';
    }
}

// 【新增函式】 從 GAS 獲取賣家清單並填充下拉選單
async function loadSellers(truckNumber) { 
    // appendLog('嘗試載入賣家清單...');
    sellerSelect.innerHTML = '<option value="">-- 載入中... --</option>';
    appendLog(`嘗試載入專車 [${truckNumber}] 的賣家清單...`);
    try {
        const sellerEndpoint = `${GAS_ENDPOINT}?action=getSellers&truck=${encodeURIComponent(truckNumber)}`;
        const resp = await fetch(sellerEndpoint);
        
        if (!resp.ok) {
            throw new Error(`HTTP 錯誤: ${resp.status}`);
        }
        
        const j = await resp.json();
        
        // 清空下拉選單
        sellerSelect.innerHTML = '<option value="">-- 請選擇賣家 --</option>'; 

        if (j.status === 'ok' && j.sellers && j.sellers.length > 0) {
            j.sellers.forEach(seller => { // 遍歷變數名稱修改
                const option = document.createElement('option');
                option.value = seller;
                option.textContent = seller;
                sellerSelect.appendChild(option);
            });
            appendLog(`專車 [${truckNumber}] 成功載入 ${j.sellers.length} 個賣家`);
        } else {
            // 如果清單為空或錯誤
            appendLog('賣家清單載入失敗或為空: ' + (j.message || '請確認 GAS 設置'));
        }
    } catch (err) {
        appendLog('載入賣家清單時發生網路錯誤');
        console.error(err);
        sellerSelect.innerHTML = '<option value="">-- 載入錯誤 --</option>'; 
    }
}

// 【新增兩個輔助函式】
function startScannerMode() {
    isScannerMode = true;
    btnSync.disabled = true; // 刷槍模式下禁用立即上傳

    // 【核心修正】建立隱藏輸入框接收刷槍輸入
    if (!scannerInputField) {
        scannerInputField = document.createElement('input');
        scannerInputField.type = 'text';
        scannerInputField.id = 'hiddenScannerInput';
        scannerInputField.autocomplete = 'off';
        scannerInputField.autocorrect = 'off';
        scannerInputField.autocapitalize = 'off';
        scannerInputField.spellcheck = false;
        scannerInputField.inputMode = 'none'; // 不顯示鍵盤
        scannerInputField.style.cssText = `
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        `;
        document.body.appendChild(scannerInputField);
    
    // // 監聽全局的鍵盤輸入
    // document.addEventListener('keydown', handleScannerInput);
    
    // statusEl.textContent = '掃描中 (刷槍)...'; // 區分模式
    // appendLog('刷槍掃描模式啟動');
    // startBatchTimer(); // 啟動自動上傳

    // 監聽 input 事件（接收完整輸入）
        scannerInputField.addEventListener('input', (e) => {
            const value = e.target.value;

            // 【新增除錯】記錄每次輸入事件
            appendLog(`🔍 [刷槍輸入] 當前值: "${value}" (長度: ${value.length})`);
            
            if (scannerTimer) clearTimeout(scannerTimer);
            
            scannerTimer = setTimeout(() => {
                const code = scannerInputField.value.trim();
                appendLog(`⏱️ [刷槍超時觸發] 最終值: "${code}" (長度: ${code.length})`);
                if (code) {
                    statusEl.textContent = '掃到: ' + code;
                    enqueue(code);
                    appendLog(`✅ [刷槍成功] ${code}`);
                } else {
                    appendLog(`⚠️ [刷槍失敗] 輸入框為空或僅有空白`);
                }
                scannerInputField.value = '';

            }, SCANNER_TIMEOUT_MS);
        });
        
        // 監聽 Enter 鍵（立即處理）
        scannerInputField.addEventListener('keydown', (e) => {
            // 【新增除錯】記錄所有按鍵
            appendLog(`⌨️ [按鍵偵測] Key: "${e.key}", Code: "${e.code}", 輸入框值: "${scannerInputField.value}"`);
            
        //     if (e.key === 'Enter') {
        //         e.preventDefault();
        //         if (scannerTimer) clearTimeout(scannerTimer);
                
        //         const code = scannerInputField.value.trim();
        //         appendLog(`↵ [Enter 觸發] 最終值: "${code}" (長度: ${code.length})`);
        //         if (code) {
        //             statusEl.textContent = '掃到: ' + code;
        //             enqueue(code);
        //             appendLog(`✅ [刷槍成功 via Enter] ${code}`);
        //         } else {
        //             appendLog(`⚠️ [Enter 但無數據] 輸入框為空`);
        //         }
        //         scannerInputField.value = '';
        //     }
        // });

            // 移除 if (e.key === 'Enter') 內的結算邏輯
        if (e.key === 'Enter') {
            e.preventDefault();
            
            // ❌ 移除這裡所有的 clearTimeout(scannerTimer); 和 enqueue(code); 邏輯
            
            // 【新增 Log】確認 Enter 有被接收，但交給超時處理
            appendLog(`↵ [Enter 偵測] 接收到 Enter，將交由 input 超時機制處理。`); 
            
            // ❗️ 關鍵：為了避免 enter 結束後再次觸發超時，可以執行以下操作
            // 讓 Enter 觸發 input 事件的超時邏輯立即運行：
            if (scannerTimer) clearTimeout(scannerTimer);
            
            // 立即觸發一個超時結算，取代舊的邏輯
            setTimeout(() => {
                // 這段邏輯與 input 監聽器中的超時邏輯相同
                const code = scannerInputField.value.trim();
                appendLog(`⏱️ [Enter 後立即結算] 最終值: "${code}"`);
                if (code) {
                    statusEl.textContent = '掃到: ' + code;
                    enqueue(code);
                    appendLog(`✅ [刷槍成功 via Enter Timeout] ${code}`);
                } else {
                     appendLog(`⚠️ [Enter 後無數據] 忽略`);
                }
                scannerInputField.value = '';
            }, 5); // 極短延遲確保輸入法完成寫入
        }
        // 否則，不做任何動作，讓輸入法在背景自行處理
    });
    }
    
    // 聚焦到隱藏輸入框
    scannerInputField.focus();
    appendLog(`🎯 [聚焦狀態] 輸入框已聚焦: ${document.activeElement === scannerInputField}`);
    
    // 每隔一段時間重新聚焦（防止失焦）
    const focusInterval = setInterval(() => {
        if (!isScannerMode) {
            clearInterval(focusInterval);
            return;
        }
       if (document.activeElement !== scannerInputField) {
            appendLog(`⚠️ [失焦偵測] 重新聚焦輸入框`);
            scannerInputField.focus();
        }
    }, 1000);
    
    statusEl.textContent = '掃描中 (刷槍)...';
    appendLog('🔫 刷槍模式啟動 - 請使用刷槍掃描');
    startBatchTimer();
}

function stopScannerMode() {
    isScannerMode = false;
    btnSync.disabled = false; // 恢復立即上傳
    
    // 移除鍵盤監聽器
    // document.removeEventListener('keydown', handleScannerInput);

    // 移除隱藏輸入框
    if (scannerInputField) {
        scannerInputField.remove();
        scannerInputField = null;
    }
    
    // 清理刷槍緩衝區和計時器
    scannerBuffer = '';
    if (scannerTimer) clearTimeout(scannerTimer);
    
    appendLog('刷槍掃描模式停止');
}
